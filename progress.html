<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals — Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-deep:#050810;--bg-mid:#090d1a;--bg-surface:#0d1220;
    --border:rgba(255,255,255,0.07);--border-act:rgba(255,255,255,0.14);
    --accent:#00e5a0;--accent-dim:rgba(0,229,160,0.12);--accent-glow:rgba(0,229,160,0.3);
    --blue:#3d8bff;--blue-dim:rgba(61,139,255,0.12);
    --orange:#fb923c;--orange-dim:rgba(251,146,60,0.12);
    --gold:#fcd34d;--gold-dim:rgba(252,211,77,0.1);
    --red:#ff4d6a;--red-dim:rgba(255,77,106,0.12);
    --purple:#a855f7;--purple-dim:rgba(168,85,247,0.1);
    --cyan:#22d3ee;--cyan-dim:rgba(34,211,238,0.1);
    --text:#dde4f0;--text-mid:#8899b4;--text-dim:#4a5568;
    --font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
    --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg-deep);color:var(--text);min-height:100vh;line-height:1.6;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 10% 0%,rgba(0,229,160,0.04),transparent 60%),radial-gradient(ellipse 60% 40% at 90% 100%,rgba(61,139,255,0.04),transparent 60%);pointer-events:none;z-index:0;}

.navbar{position:sticky;top:0;z-index:100;background:rgba(5,8,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 24px;height:64px;}
.brand{display:flex;align-items:center;gap:12px;margin-right:8px;}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#00b87a);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:0.85em;color:#050810;box-shadow:0 0 16px var(--accent-glow);}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:1em;}
.brand-sub{font-size:0.65em;color:var(--text-dim);margin-top:-2px;}
.nav-div{width:1px;height:28px;background:var(--border);margin:0 8px;}
.nav-pill{padding:7px 14px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--text-mid);font-family:var(--font-body);font-size:0.82em;font-weight:500;cursor:pointer;transition:all 0.18s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.nav-pill:hover{background:rgba(255,255,255,0.05);color:var(--text);}
.nav-pill.active{background:var(--accent-dim);border-color:var(--accent-glow);color:var(--accent);}
.nav-spacer{flex:1;}
.add-btn{display:flex;align-items:center;gap:7px;padding:8px 18px;border-radius:9px;background:var(--accent-dim);border:1px solid rgba(0,229,160,0.25);color:var(--accent);font-family:var(--font-body);font-size:0.82em;font-weight:700;cursor:pointer;transition:all 0.18s;}
.add-btn:hover{background:rgba(0,229,160,0.22);border-color:rgba(0,229,160,0.45);}

.container{max-width:1400px;margin:0 auto;padding:36px 24px 80px;position:relative;z-index:1;}

.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:44px;}
.page-title{font-family:var(--font-display);font-size:2.2em;font-weight:900;letter-spacing:-1.5px;line-height:1;}
.page-title span{color:var(--accent);}
.page-sub{font-size:0.84em;color:var(--text-mid);margin-top:7px;}
.header-stats{display:flex;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.hstat{padding:12px 24px;text-align:center;}
.hstat:not(:last-child){border-right:1px solid var(--border);}
.hstat-val{font-family:var(--font-display);font-size:1.5em;font-weight:800;line-height:1;}
.hstat-lbl{font-size:0.6em;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);margin-top:3px;}

.goals-section{margin-bottom:50px;}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.section-label{font-family:var(--font-display);font-size:0.75em;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);white-space:nowrap;}
.section-line{flex:1;height:1px;background:var(--border);}
.section-count{font-size:0.62em;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-dim);}

/* GRID — drop target */
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;min-height:100px;border-radius:16px;padding:4px;transition:background 0.2s,outline 0.2s;}
.badges-grid.drag-over{outline:2px dashed rgba(255,255,255,0.15);outline-offset:-2px;}
.badges-grid.drag-over-progress{background:rgba(251,146,60,0.04);outline-color:rgba(251,146,60,0.4);}
.badges-grid.drag-over-done{background:rgba(0,229,160,0.04);outline-color:rgba(0,229,160,0.4);}
.badges-grid.drag-over-future{background:rgba(255,255,255,0.02);}

/* BADGE CARD */
.badge-card{border-radius:16px;padding:24px 18px 20px;text-align:center;cursor:grab;transition:all 0.25s cubic-bezier(0.2,0,0,1);position:relative;overflow:hidden;border:1px solid var(--border);background:var(--bg-surface);animation:cardIn 0.4s cubic-bezier(0.2,0,0,1) both;user-select:none;}
.badge-card:active{cursor:grabbing;}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(0.97);}to{opacity:1;transform:none;}}
.badge-card:hover{transform:translateY(-5px);}
.badge-card.done{background:linear-gradient(145deg,rgba(0,229,160,0.08),rgba(0,229,160,0.02) 50%,var(--bg-surface));border-color:rgba(0,229,160,0.2);}
.badge-card.done:hover{box-shadow:0 16px 48px rgba(0,229,160,0.12),0 0 0 1px rgba(0,229,160,0.3);border-color:rgba(0,229,160,0.35);}
.badge-card.progress{background:linear-gradient(145deg,rgba(251,146,60,0.07),rgba(251,146,60,0.02) 50%,var(--bg-surface));border-color:rgba(251,146,60,0.2);}
.badge-card.progress:hover{box-shadow:0 16px 48px rgba(251,146,60,0.1);border-color:rgba(251,146,60,0.35);}
.badge-card.future{opacity:0.5;filter:saturate(0.4);}
.badge-card.future:hover{opacity:0.85;filter:saturate(0.8);transform:translateY(-3px);}
.badge-card.dragging{opacity:0.3 !important;transform:scale(0.95) !important;filter:none !important;}

.badge-status-pill{position:absolute;top:11px;right:11px;font-size:0.58em;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:0.3px;}
.badge-status-pill.done{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,229,160,0.2);}
.badge-status-pill.progress{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(251,146,60,0.2);animation:ppulse 2s ease-in-out infinite;}
.badge-status-pill.future{background:rgba(255,255,255,0.04);color:var(--text-dim);border:1px solid var(--border);}
@keyframes ppulse{0%,100%{opacity:1;}50%{opacity:0.55;}}

.badge-icon-wrap{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.75em;transition:transform 0.25s;}
.badge-card:hover .badge-icon-wrap{transform:scale(1.1) rotate(-4deg);}
.badge-card.done     .badge-icon-wrap{background:rgba(0,229,160,0.1);box-shadow:0 0 20px rgba(0,229,160,0.2);}
.badge-card.progress .badge-icon-wrap{background:rgba(251,146,60,0.1);box-shadow:0 0 16px rgba(251,146,60,0.15);}
.badge-card.future   .badge-icon-wrap{background:rgba(255,255,255,0.04);}

.badge-title{font-family:var(--font-display);font-weight:700;font-size:0.88em;margin-bottom:6px;line-height:1.3;}
.badge-desc{font-size:0.72em;color:var(--text-mid);line-height:1.45;margin-bottom:10px;}
.badge-card.future .badge-desc{color:var(--text-dim);}

.badge-cat-pill{font-size:0.6em;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:8px;}
.cat-funded  {background:var(--blue-dim);  color:var(--blue);  border:1px solid rgba(61,139,255,0.2);}
.cat-profit  {background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,229,160,0.2);}
.cat-payout  {background:var(--gold-dim);  color:var(--gold);  border:1px solid rgba(252,211,77,0.2);}
.cat-personal{background:var(--cyan-dim);  color:var(--cyan);  border:1px solid rgba(34,211,238,0.2);}
.cat-skill   {background:var(--purple-dim);color:var(--purple);border:1px solid rgba(168,85,247,0.2);}
.cat-milestone{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(251,146,60,0.2);}

.badge-date{font-size:0.62em;color:var(--text-dim);font-family:var(--font-mono);display:block;}
.done-glow{position:absolute;bottom:10px;right:12px;font-size:0.85em;color:var(--accent);opacity:0.7;text-shadow:0 0 8px var(--accent-glow);}

.badge-add-card{border-radius:16px;padding:24px 18px;text-align:center;cursor:pointer;border:2px dashed rgba(255,255,255,0.08);background:transparent;transition:all 0.2s;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;font-size:0.82em;}
.badge-add-card:hover{border-color:rgba(0,229,160,0.3);color:var(--accent);background:var(--accent-dim);}
.badge-add-card .add-icon{font-size:1.8em;opacity:0.4;transition:all 0.2s;}
.badge-add-card:hover .add-icon{opacity:1;transform:scale(1.1);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);z-index:9999;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{background:linear-gradient(145deg,#141e33,#0d1525);border:1px solid rgba(0,229,160,0.18);border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:0 24px 80px rgba(0,0,0,0.7);animation:modalIn 0.28s cubic-bezier(0.2,0,0,1.1);}
@keyframes modalIn{from{opacity:0;transform:scale(0.94) translateY(10px);}to{opacity:1;transform:none;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.modal-title{font-family:var(--font-display);font-size:1.05em;font-weight:800;}
.modal-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text-mid);cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.modal-close:hover{background:rgba(255,255,255,0.1);color:var(--text);}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-field label{font-size:0.68em;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;}
.form-field input,.form-field select,.form-field textarea{padding:10px 13px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;color:var(--text);font-family:var(--font-body);font-size:0.85em;transition:border-color 0.2s;width:100%;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:rgba(0,229,160,0.4);}
.form-field select option{background:#0d1220;}
.form-field textarea{resize:vertical;min-height:70px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:8px;margin-top:22px;}
.btn-save{flex:1;padding:11px;background:var(--accent-dim);border:1px solid rgba(0,229,160,0.3);border-radius:10px;color:var(--accent);font-size:0.87em;font-weight:700;cursor:pointer;transition:all 0.15s;}
.btn-save:hover{background:rgba(0,229,160,0.2);}
.btn-cancel{padding:11px 16px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;color:var(--text-mid);font-size:0.85em;cursor:pointer;}
.btn-delete{padding:11px 14px;background:var(--red-dim);border:1px solid rgba(255,77,106,0.2);border-radius:10px;color:var(--red);font-size:0.85em;cursor:pointer;transition:all 0.15s;}
.btn-delete:hover{background:rgba(255,77,106,0.2);}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:0.84em;font-weight:700;z-index:99999;animation:fadeIn 0.25s ease;}
.toast.success{background:rgba(0,229,160,0.12);border:1px solid rgba(0,229,160,0.25);color:var(--accent);}
.toast.error{background:var(--red-dim);border:1px solid rgba(255,77,106,0.25);color:var(--red);}
.toast.info{background:var(--orange-dim);border:1px solid rgba(251,146,60,0.25);color:var(--orange);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,0.08);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;}
</style>
</head>
<body>

<nav class="navbar">
    <div class="brand">
        <div class="brand-icon">TJ</div>
        <div>
            <div class="brand-name">Trading Journal</div>
            <div class="brand-sub">Multi-Account</div>
        </div>
    </div>
    <div class="nav-div"></div>
    <a href="prop-firm-1.html" class="nav-pill">📒 Jurnal</a>
    <a href="analiza.html" class="nav-pill">📈 Analize</a>
    <a href="achievements.html" class="nav-pill active">🏆 Goals</a>
    <div class="nav-spacer"></div>
    <button class="add-btn" onclick="openAddModal()">＋ Adaugă Goal</button>
</nav>

<div class="container">
    <div class="page-header">
        <div>
            <div class="page-title">Trading <span>Goals</span></div>
            <div class="page-sub">Trage un card dintr-o secțiune în alta pentru a-i schimba statusul</div>
        </div>
        <div class="header-stats">
            <div class="hstat">
                <div class="hstat-val" id="statDone" style="color:var(--accent);">—</div>
                <div class="hstat-lbl">Completate</div>
            </div>
            <div class="hstat">
                <div class="hstat-val" id="statProgress" style="color:var(--orange);">—</div>
                <div class="hstat-lbl">În progres</div>
            </div>
            <div class="hstat">
                <div class="hstat-val" id="statFuture" style="color:var(--text-dim);">—</div>
                <div class="hstat-lbl">Viitoare</div>
            </div>
        </div>
    </div>

    <div class="goals-section">
        <div class="section-head">
            <span class="section-label" style="color:var(--orange);">⚡ În Progres</span>
            <div class="section-line"></div>
            <span class="section-count" id="count-progress" style="color:var(--orange);border-color:rgba(251,146,60,0.2);background:var(--orange-dim);">0</span>
        </div>
        <div class="badges-grid" id="grid-progress" data-status="progress"></div>
    </div>

    <div class="goals-section">
        <div class="section-head">
            <span class="section-label" style="color:var(--accent);">✅ Completate</span>
            <div class="section-line"></div>
            <span class="section-count" id="count-done" style="color:var(--accent);border-color:rgba(0,229,160,0.2);background:var(--accent-dim);">0</span>
        </div>
        <div class="badges-grid" id="grid-done" data-status="done"></div>
    </div>

    <div class="goals-section">
        <div class="section-head">
            <span class="section-label">🔮 Viitoare</span>
            <div class="section-line"></div>
            <span class="section-count" id="count-future">0</span>
        </div>
        <div class="badges-grid" id="grid-future" data-status="future"></div>
    </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="goalModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Goal Nou</div>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="form-field">
            <label>Titlu *</label>
            <input type="text" id="f-title" placeholder="ex: Primul Payout FTMO">
        </div>
        <div class="form-field">
            <label>Descriere</label>
            <textarea id="f-desc" placeholder="Detalii despre acest goal..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-field">
                <label>Categorie</label>
                <select id="f-cat">
                    <option value="funded">Cont Funded</option>
                    <option value="profit">Profit Target</option>
                    <option value="payout">Payout</option>
                    <option value="personal">Personal Account</option>
                    <option value="skill">Skill</option>
                    <option value="milestone">Milestone</option>
                </select>
            </div>
            <div class="form-field">
                <label>Status</label>
                <select id="f-status">
                    <option value="future">Viitor</option>
                    <option value="progress">În Progres</option>
                    <option value="done">Completat</option>
                </select>
            </div>
        </div>
        <div class="form-field">
            <label>Dată target / completat</label>
            <input type="date" id="f-date">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Anulează</button>
            <button class="btn-delete" id="btnDelete" onclick="deleteGoal()" style="display:none;">🗑 Șterge</button>
            <button class="btn-save" onclick="saveGoal()">✓ Salvează</button>
        </div>
    </div>
</div>

<script>
const GS_URL      = 'https://script.google.com/macros/s/AKfycby545E0z1U_T4y7Obgp7jbkhjEM-nTQ14zccKu3_WhAWI93028iGy3JHPHk9XJvU1_5/exec';
const GOALS_SHEET = 'Goals';

const CAT_ICONS  = {funded:'🏦',profit:'📈',payout:'💸',personal:'👤',skill:'🧠',milestone:'⭐'};
const CAT_LABELS = {funded:'Funded',profit:'Profit Target',payout:'Payout',personal:'Personal Account',skill:'Skill',milestone:'Milestone'};

let goals     = [];
let editingId = null;
let saving    = false;
let dragId    = null;

// ── INIT ──
async function init() {
    renderLoading();
    await loadGoals();
    renderAll();
    initDropZones();
}

function renderLoading() {
    ['progress','done','future'].forEach(s => {
        document.getElementById('grid-'+s).innerHTML =
            '<div style="padding:8px 0;display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:0.8em;"><span class="spin"></span> Se încarcă...</div>';
    });
}

async function loadGoals() {
    try {
        const r = await fetch(GS_URL+'?action=get&sheet='+GOALS_SHEET, {signal:AbortSignal.timeout(10000)});
        const j = await r.json();
        if (j.result === 'success' && Array.isArray(j.data) && j.data.length > 0) {
            goals = j.data.map(g => ({
                id:       g.id        || String(Date.now()+Math.random()),
                title:    g.title     || '',
                desc:     g.desc      || '',
                cat:      g.cat       || 'milestone',
                status:   g.status    || 'future',
                date:     g.date      || '',
                createdAt:g.createdAt || ''
            }));
            return;
        }
    } catch(e) { console.warn('Sheets load failed:', e); }
    goals = [];
}

// ── RENDER ──
function renderAll() {
    const counts = {done:0, progress:0, future:0};
    goals.forEach(g => { if (counts[g.status] !== undefined) counts[g.status]++; });
    document.getElementById('statDone').textContent     = counts.done;
    document.getElementById('statProgress').textContent = counts.progress;
    document.getElementById('statFuture').textContent   = counts.future;
    ['done','progress','future'].forEach(s => document.getElementById('count-'+s).textContent = counts[s]);
    ['progress','done','future'].forEach(renderSection);
    attachDragHandlers();
}

function renderSection(status) {
    const grid = document.getElementById('grid-'+status);
    const list = goals.filter(g => g.status === status);
    let html   = '';

    list.forEach((g, i) => {
        const icon  = CAT_ICONS[g.cat]  || '⭐';
        const label = CAT_LABELS[g.cat] || g.cat;
        const pill  = status==='done' ? '✅ Done' : status==='progress' ? '⚡ Live' : '🔮 Soon';
        html += `<div class="badge-card ${status}"
                      data-id="${g.id}"
                      draggable="true"
                      style="animation-delay:${i*0.05}s">
            <span class="badge-status-pill ${status}">${pill}</span>
            <div class="badge-icon-wrap">${icon}</div>
            <div class="badge-title">${esc(g.title)}</div>
            <div class="badge-desc">${esc(g.desc)}</div>
            <span class="badge-cat-pill cat-${g.cat}">${label}</span>
            ${g.date ? `<span class="badge-date">📅 ${fmtDate(g.date)}</span>` : ''}
            ${status==='done' ? '<div class="done-glow">✓</div>' : ''}
        </div>`;
    });

    html += `<div class="badge-add-card" onclick="openAddModal('${status}')">
        <div class="add-icon">＋</div><div>Adaugă goal</div>
    </div>`;

    grid.innerHTML = html;

    // Click = edit (doar dacă nu e în mijlocul unui drag)
    grid.querySelectorAll('.badge-card').forEach(card => {
        card.addEventListener('click', () => {
            if (!card.classList.contains('dragging')) openEditModal(card.dataset.id);
        });
    });
}

// ── DRAG & DROP ──
function attachDragHandlers() {
    document.querySelectorAll('.badge-card[draggable]').forEach(card => {
        card.addEventListener('dragstart', function(e) {
            dragId = this.dataset.id;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragId);
        });
        card.addEventListener('dragend', function() {
            this.classList.remove('dragging');
            document.querySelectorAll('.badges-grid').forEach(g =>
                g.classList.remove('drag-over','drag-over-progress','drag-over-done','drag-over-future')
            );
            dragId = null;
        });
    });
}

function initDropZones() {
    ['progress','done','future'].forEach(status => {
        const grid = document.getElementById('grid-'+status);

        grid.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over', 'drag-over-'+status);
        });

        grid.addEventListener('dragleave', function(e) {
            if (!this.contains(e.relatedTarget)) {
                this.classList.remove('drag-over','drag-over-progress','drag-over-done','drag-over-future');
            }
        });

        grid.addEventListener('drop', async function(e) {
            e.preventDefault();
            this.classList.remove('drag-over','drag-over-progress','drag-over-done','drag-over-future');

            const id   = e.dataTransfer.getData('text/plain') || dragId;
            const goal = goals.find(g => g.id === id);
            if (!goal || goal.status === status) return;

            goal.status = status;
            renderAll();

            const labels = {progress:'⚡ În Progres', done:'✅ Completat', future:'🔮 Viitor'};
            showToast(`Mutat → ${labels[status]}`, 'info');

            try {
                const r = await fetch(GS_URL, {
                    method:'POST',
                    body: JSON.stringify({action:'updateGoal', sheet:GOALS_SHEET, ...goal})
                });
                const j = await r.json();
                if (j.result === 'success') showToast('✓ Salvat', 'success');
                else showToast('Eroare Sheets: '+(j.message||''), 'error');
            } catch(err) {
                showToast('Salvat local — fără conexiune', 'error');
            }
        });
    });
}

// ── MODAL ──
function openAddModal(defaultStatus) {
    editingId = null;
    document.getElementById('modalTitle').textContent = '➕ Goal Nou';
    document.getElementById('btnDelete').style.display = 'none';
    document.getElementById('f-title').value  = '';
    document.getElementById('f-desc').value   = '';
    document.getElementById('f-cat').value    = 'milestone';
    document.getElementById('f-status').value = defaultStatus || 'future';
    document.getElementById('f-date').value   = '';
    document.getElementById('goalModal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 100);
}

function openEditModal(id) {
    const g = goals.find(g => g.id === id);
    if (!g) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = '✏️ Editează Goal';
    document.getElementById('btnDelete').style.display = 'block';
    document.getElementById('f-title').value  = g.title;
    document.getElementById('f-desc').value   = g.desc;
    document.getElementById('f-cat').value    = g.cat;
    document.getElementById('f-status').value = g.status;
    document.getElementById('f-date').value   = g.date;
    document.getElementById('goalModal').classList.add('open');
}

function closeModal() {
    document.getElementById('goalModal').classList.remove('open');
    editingId = null;
}

// ── SAVE / DELETE ──
async function saveGoal() {
    if (saving) return;
    const title = document.getElementById('f-title').value.trim();
    if (!title) { showToast('Introdu un titlu!', 'error'); document.getElementById('f-title').focus(); return; }

    const isNew = !editingId;
    const goal  = {
        id:        editingId || String(Date.now()),
        title,
        desc:      document.getElementById('f-desc').value.trim(),
        cat:       document.getElementById('f-cat').value,
        status:    document.getElementById('f-status').value,
        date:      document.getElementById('f-date').value,
        createdAt: isNew ? new Date().toISOString()
                         : (goals.find(g => g.id === editingId)?.createdAt || new Date().toISOString()),
    };

    if (isNew) goals.push(goal);
    else { const i = goals.findIndex(g => g.id === editingId); if (i >= 0) goals[i] = goal; }

    closeModal();
    renderAll();

    saving = true;
    try {
        const action = isNew ? 'addGoal' : 'updateGoal';
        const r = await fetch(GS_URL, {method:'POST', body:JSON.stringify({action, sheet:GOALS_SHEET, ...goal})});
        const j = await r.json();
        showToast(j.result === 'success'
            ? (isNew ? '✓ Goal adăugat' : '✓ Goal actualizat')
            : ('Salvat local — '+(j.message||'')),
            j.result === 'success' ? 'success' : 'error');
    } catch(e) { showToast('Salvat local — fără conexiune', 'error'); }
    saving = false;
}

async function deleteGoal() {
    if (!editingId || !confirm('Șterge acest goal?')) return;
    const id = editingId;
    goals = goals.filter(g => g.id !== id);
    closeModal();
    renderAll();
    showToast('🗑 Goal șters');
    try { await fetch(GS_URL, {method:'POST', body:JSON.stringify({action:'deleteGoal', sheet:GOALS_SHEET, id})}); } catch(e){}
}

// ── UTILS ──
function fmtDate(s) {
    try { return new Date(s+'T12:00:00').toLocaleDateString('ro-RO',{day:'numeric',month:'short',year:'numeric'}); } catch{ return s; }
}
function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showToast(msg, type='success') {
    const t = document.createElement('div');
    t.className = 'toast '+type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

document.getElementById('goalModal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
document.getElementById('f-title').addEventListener('keydown', e => { if(e.key==='Enter') saveGoal(); });

init();
</script>
